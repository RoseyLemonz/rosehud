con_timestamp	"0"

// Required for quick dimmer reload
sv_cheats 1

// Force minmode off

// Fix options stutter
refresh_options_dialog

// command for fix_all button in menu, to fix some hud problems and invisible players
alias "fix_all"     "stop; ds_record; snd_restart; hud_reloadscheme"

exec rosehud_customizations
exec rosehud_music
exec rosehud_notutorial

tf_mm_dashboard_slide_panel_step 20
tf_dashboard_slide_time 0.15
tf_hud_target_id_alpha 155
cl_showbackpackrarities 1

// Run so settings get properly applied
hud_reloadscheme

// Version echo for console
alias "rosehud_version" echo "roseHUD v0.3"

// Execute first HUD launch setup
alias "rosehud_firstrun" "exec rosehud_firstrun"
exec rosehud/rosehud_setup.txt
rosehud_firstrun

// Apply quick dimmer reload
alias dimmerfix "testhudanim DimmerFix"
dimmerfix

echo ""
echo "roseHUD successfully initialized!"
echo ""