con_timestamp	"0"

//==============================================================
// Required settings
//==============================================================

// Required for quick dimmer reload
sv_cheats 1

// Force minmode off
cl_hud_minmode 0

// Fix options stutter
refresh_options_dialog

// Misc HUD settings
tf_mm_dashboard_slide_panel_step 20
tf_dashboard_slide_time 0.15
tf_hud_target_id_alpha 155

hud_reloadscheme

//==============================================================
// Execute customizations
//==============================================================
exec rosehud_customizations.cfg

//==============================================================
// Version echo for console
//==============================================================
alias "rosehud_version" echo "roseHUD v0.2"

//==============================================================
// Execute first HUD launch setup
//==============================================================
alias "rosehud_firstrun" "exec rosehud_firstrun"
exec rosehud/rosehud_setup.txt
rosehud_firstrun

//==============================================================
// Execute menu music script
//==============================================================
exec rosehud_music.cfg

//==============================================================
// Apply quick dimmer reload
//==============================================================
alias dimmerfix "testhudanim DimmerFix"
dimmerfix

echo ""
echo "roseHUD successfully initialized!"
echo ""
