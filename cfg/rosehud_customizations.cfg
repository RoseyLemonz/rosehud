alias "hud_chatpos_log"		"con_logfile cfg/rosehud/hud_chatpos.txt"

alias "hud_chatpos_bottom"	"hud_chatpos_clear"
alias "hud_chatpos_top"		"hud_chatpos_clear; hud_chatpos_log; echo x{HudChat{ypos 25}}; console_unlog"

