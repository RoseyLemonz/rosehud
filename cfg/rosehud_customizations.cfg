alias "hud_healthicon_log"		"con_logfile cfg/rosehud/hud_healthicon.txt"

alias "hud_ammoicon_on"			"hud_ammoicon_clear"
alias "hud_ammoicon_off"		"hud_ammoicon_clear; hud_ammoicon_log; echo x{HudAmmoIco{xpos 9999}HudWeaponLowAmmoImage{xpos 9999}}; console_unlog"

alias "hud_healthicon_on"		"hud_healthicon_clear"
alias "hud_healthicon_off"	    "hud_healthicon_clear; hud_healthicon_log; echo x{PlayerStatusHealthImage{xpos 9999}PlayerStatusHealthBonusImage{xpos 9999}}; console_unlog"

