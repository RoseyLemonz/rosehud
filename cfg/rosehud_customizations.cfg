// TEAM INDICATOR
//==============================================================

alias "hud_indicatorpos_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_teamindicatorpos.txt"
alias "hud_indicatorpos_log"	"con_logfile cfg/rosehud/hud_teamindicatorpos.txt"

alias "hud_indicatorvis_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_teamindicatorvis.txt"
alias "hud_indicatorvis_log"	"con_logfile cfg/rosehud/hud_teamindicatorvis.txt"

alias "hud_indicator_invis"		"hud_indicatorvis_clear"
alias "hud_indicator_visible"	"hud_indicatorvis_clear; hud_indicatorvis_log; echo x{TeamIndicator{visible 1}}; console_unlog"

