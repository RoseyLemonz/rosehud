//==============================================================
// FULL RESET
//==============================================================

alias "customization_reset1"	"hud_charatheme_sakaki; hud_font_tf; hud_chatpos_bottom; hud_indicator_invis; hud_indicator_left"
alias "customization_reset2"	""
alias "customization_reset"		"exec customization_reset1; exec customization_reset2"
