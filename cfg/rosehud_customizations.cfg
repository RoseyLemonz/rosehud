con_timestamp	"0"

alias "console_unlog"	"con_logfile console.log"

alias "fix_all"			"stop; ds_record; snd_restart; hud_reloadscheme"

//==============================================================
// CHARACTER THEME
//==============================================================

// MENU LABEL

alias "hud_charalabel_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_charalabel.txt"
alias "hud_charalabel_log"		"con_logfile cfg/rosehud/hud_charalabel.txt"

alias "hud_charalabel_sakaki"	"hud_charalabel_clear"
alias "hud_charalabel_ellep"	"hud_charalabel_clear; hud_charalabel_log; echo x{HudTheme{labelText ElizabethTheme} HudThemeShadow{labelText ElizabethTheme} NoGCImage{image replay/thumbnails/characters/ellephurt}}; console_unlog"

// HUD IMAGE

alias "hud_charaimage_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_charaimage.txt"
alias "hud_charaimage_log"		"con_logfile cfg/rosehud/hud_charaimage.txt"

alias "hud_charaimage_sakaki"	"hud_charaimage_clear"
alias "hud_charaimage_ellep"	"hud_charaimage_clear; hud_charaimage_log; echo x{PlayerCharaImage{image replay/thumbnails/characters/ellep} PlayerCharaImageHurt{image replay/thumbnails/characters/ellephurt} PlayerCharaImageBonus{image replay/thumbnails/characters/ellepdance}}; console_unlog"

// CLIENTSCHEME


alias "hud_charascheme_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_charascheme.txt"
alias "hud_charascheme_log"		"con_logfile cfg/rosehud/hud_charascheme.txt"

alias "hud_charascheme_sakaki"	"hud_charascheme_clear"
alias "hud_charascheme_ellep"	"hud_charascheme_clear; hud_charascheme_log; echo #base ../../custom/rosehud/_customization/theme/ellep/ellepscheme.res; console_unlog"

// ALL

alias "hud_charatheme_sakaki"	"hud_charalabel_sakaki; hud_charaimage_sakaki; hud_charascheme_sakaki"
alias "hud_charatheme_ellep"	"hud_charalabel_ellep; hud_charaimage_ellep; hud_charascheme_ellep"

//==============================================================
// FONTS
//==============================================================

alias "hud_font_clear"		"sixense_clear_bindings; sixense_write_bindings rosehud/hud_font.txt"
alias "hud_font_log"		"con_logfile cfg/rosehud/hud_font.txt"

alias "hud_font_tf"			"hud_font_clear"
alias "hud_font_bahn"		"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_bahn.res; console_unlog"
alias "hud_font_luxi"		"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_luxi.res; console_unlog"
alias "hud_font_caslon"	    "hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_caslon.res; console_unlog"
alias "hud_font_wingding"	"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_wingding.res; console_unlog"
alias "hud_font_sans"		"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_sans.res; console_unlog"
alias "hud_font_papyrus"	"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_papyrus.res; console_unlog"
alias "hud_font_iosevka"	"hud_font_clear; hud_font_log; echo #base ../../custom/rosehud/_customization/fonts/font_iosevka.res; console_unlog"

//==============================================================
// CHAT POSITION
//==============================================================

alias "hud_chatpos_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_chatpos.txt"
alias "hud_chatpos_log"		"con_logfile cfg/rosehud/hud_chatpos.txt"

alias "hud_chatpos_bottom"	"hud_chatpos_clear"
alias "hud_chatpos_top"		"hud_chatpos_clear; hud_chatpos_log; echo x{HudChat{ypos 35}}; console_unlog"

//==============================================================
// TEAM INDICATOR
//==============================================================

alias "hud_indicatorpos_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_teamindicatorpos.txt"
alias "hud_indicatorpos_log"	"con_logfile cfg/rosehud/hud_teamindicatorpos.txt"

alias "hud_indicatorvis_clear"	"sixense_clear_bindings; sixense_write_bindings rosehud/hud_teamindicatorvis.txt"
alias "hud_indicatorvis_log"	"con_logfile cfg/rosehud/hud_teamindicatorvis.txt"

alias "hud_indicator_invis"		"hud_indicatorvis_clear"
alias "hud_indicator_visible"	"hud_indicatorvis_clear; hud_indicatorvis_log; echo x{TeamIndicator{visible 1}}; console_unlog"

alias "hud_indicator_left"		"hud_indicatorpos_clear"
alias "hud_indicator_right"		"hud_indicatorpos_clear; hud_indicatorpos_log; echo x{TeamIndicator{xpos rs1 teambg_2 replay/thumbnails/hud/redrightcorner teambg_3 replay/thumbnails/hud/blurightcorner}}; console_unlog"

//==============================================================
// FULL RESET
//==============================================================

alias "customization_reset1"			"hud_charatheme_sakaki; hud_font_tf; hud_chatpos_bottom; hud_indicator_invis; hud_indicator_left"
alias "customization_reset2"			""
alias "customization_reset"				"exec customization_reset1; exec customization_reset2"
