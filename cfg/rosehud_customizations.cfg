alias "hud_indicator_right"		"hud_indicatorpos_clear; hud_indicatorpos_log; echo x{TeamIndicator{xpos rs1 teambg_2 replay/thumbnails/hud/redrightcorner teambg_3 replay/thumbnails/hud/blurightcorner}}; console_unlog"

