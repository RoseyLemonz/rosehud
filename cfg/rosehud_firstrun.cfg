con_timestamp	"0"

// On first HUD launch creates a rosehud folder inside tf/cfg

alias "rosehud_folder" "host_writeconfig rosehud_temporary_cfg_backup.cfg full; ds_dir cfg/rosehud; ds_log 0; ds_record; ds_stop; exec rosehud_temporary_cfg_backup.cfg; ds_dir demos; ds_log 0; ds_record; ds_stop"
rosehud_folder

// Generates rosehud_setup.txt, then stops the file from executing each time the game is launched

con_logfile		"cfg/rosehud/rosehud_setup.txt"
echo			"alias rosehud_firstrun"
con_logfile		"console.log"
